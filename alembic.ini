# Alembic configuration for TaxVault.
#
# The database URL is NOT written here. It comes from TAXVAULT_DATABASE_URL at
# runtime (see migrations/env.py), because this file is in version control and
# a production DSN with a password in version control is a breach waiting for
# a `git clone`.
[alembic]
script_location = migrations
prepend_sys_path = .
# Alembic 1.20 warns without this and falls back to splitting the path on
# spaces, commas AND colons -- which breaks the moment a path contains one.
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
