<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img"
     aria-label="TaxVault — AI-powered tax filing. Secure. Accurate. Trusted.">
  <title>TaxVault</title>
  <desc>A vault door beside a shield carrying circuit traces, above the TaxVault wordmark.</desc>
  <defs>
    <clipPath id="tvl-shield">
      <path d="M358 84 L416 102 L416 178 C416 218 384 244 358 254 C332 244 300 218 300 178 L300 102 Z"/>
    </clipPath>
  </defs>

  <!-- Vault door. Drawn first so the shield overlaps its right side, which is
       what gives the lockup its depth. -->
  <g>
    <circle cx="274" cy="176" r="80" fill="none" stroke="#18305F" stroke-width="20"/>
    <circle cx="274" cy="176" r="56" fill="none" stroke="#18305F" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="250 102"
            transform="rotate(-140 274 176)"/>
    <g fill="#C9A227">
      <circle cx="274" cy="114" r="6.5"/>
      <circle cx="274" cy="238" r="6.5"/>
      <circle cx="212" cy="176" r="6.5"/>
      <circle cx="327" cy="131" r="6.5"/>
      <circle cx="327" cy="221" r="6.5"/>
    </g>
    <g stroke="#18305F" stroke-width="11" stroke-linecap="round">
      <line x1="274" y1="176" x2="286" y2="132"/>
      <line x1="274" y1="176" x2="318" y2="188"/>
      <line x1="274" y1="176" x2="262" y2="220"/>
      <line x1="274" y1="176" x2="230" y2="164"/>
    </g>
    <circle cx="274" cy="176" r="19" fill="#C9A227"/>
    <circle cx="274" cy="176" r="8.5" fill="#FFFFFF"/>
  </g>

  <!-- Shield: navy on the guard side, green on the growth side. -->
  <g>
    <path d="M358 84 L416 102 L416 178 C416 218 384 244 358 254 C332 244 300 218 300 178 L300 102 Z"
          fill="#18305F"/>
    <path d="M358 84 L416 102 L416 178 C416 218 384 244 358 254 Z" fill="#107A4B"/>
    <path d="M358 98 L404 112 L404 176 C404 208 379 229 358 238 C337 229 312 208 312 176 L312 112 Z"
          fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <g clip-path="url(#tvl-shield)" stroke="#FFFFFF" stroke-width="2.4" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M358 104 V236"/>
      <path d="M358 126 H336 V152"/>
      <path d="M358 152 H380 V176"/>
      <path d="M358 178 H334 V202"/>
      <path d="M358 202 H382 V220"/>
      <path d="M336 168 H322 V188"/>
      <path d="M380 130 H394 V148"/>
    </g>
    <g fill="#FFFFFF" clip-path="url(#tvl-shield)">
      <circle cx="336" cy="152" r="4"/><circle cx="380" cy="176" r="4"/>
      <circle cx="334" cy="202" r="4"/><circle cx="382" cy="220" r="4"/>
      <circle cx="322" cy="188" r="4"/><circle cx="394" cy="148" r="4"/>
      <circle cx="336" cy="168" r="3.2"/><circle cx="380" cy="130" r="3.2"/>
    </g>
  </g>

  <!-- Wordmark. `textLength` pins the width so the lockup is identical whatever
       font the viewer actually resolves. -->
  <text x="300" y="338" text-anchor="middle" textLength="404" lengthAdjust="spacingAndGlyphs"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="94" letter-spacing="-1.5">
    <tspan fill="#18305F">Tax</tspan><tspan fill="#107A4B">Vault</tspan>
  </text>

  <!-- Tagline, between two gold rules. -->
  <g>
    <line x1="58" y1="372" x2="108" y2="372" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
    <line x1="492" y1="372" x2="542" y2="372" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
    <text x="300" y="378" text-anchor="middle" textLength="356" lengthAdjust="spacingAndGlyphs"
          fill="#1F5FA8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif"
          font-weight="600" font-size="15">
      AI-POWERED TAX FILING. SECURE. ACCURATE. TRUSTED.
    </text>
  </g>
</svg>
