      <path d="M186 64 V204"/>
      <path d="M186 86 H164 V112"/>
      <path d="M186 112 H208 V136"/>
      <path d="M186 138 H162 V162"/>
      <path d="M186 162 H210 V180"/>
      <path d="M164 128 H150 V148"/>
      <path d="M208 90 H222 V108"/>
