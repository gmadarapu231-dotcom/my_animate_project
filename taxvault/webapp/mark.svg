<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="TaxVault">
  <title>TaxVault</title>
  <!-- The mark alone, square, for the favicon, the app icon and the header.
       Vector rather than raster so it stays sharp from 16px to a splash
       screen, at about 2KB instead of a download. -->
  <defs>
    <clipPath id="tvm-shield">
      <path d="M186 44 L242 62 L242 140 C242 182 210 210 186 222 C162 210 130 182 130 140 L130 62 Z"/>
    </clipPath>
  </defs>

  <g>
    <circle cx="96" cy="128" r="68" fill="none" stroke="#18305F" stroke-width="18"/>
    <circle cx="96" cy="128" r="47" fill="none" stroke="#18305F" stroke-width="4.5"
            stroke-linecap="round" stroke-dasharray="210 86" transform="rotate(-140 96 128)"/>
    <g fill="#C9A227">
      <circle cx="96" cy="75" r="5.6"/>
      <circle cx="96" cy="181" r="5.6"/>
      <circle cx="43" cy="128" r="5.6"/>
      <circle cx="141" cy="90" r="5.6"/>
      <circle cx="141" cy="166" r="5.6"/>
    </g>
    <g stroke="#18305F" stroke-width="10" stroke-linecap="round">
      <line x1="96" y1="128" x2="106" y2="90"/>
      <line x1="96" y1="128" x2="134" y2="138"/>
      <line x1="96" y1="128" x2="86" y2="166"/>
      <line x1="96" y1="128" x2="58" y2="118"/>
    </g>
    <circle cx="96" cy="128" r="17" fill="#C9A227"/>
    <circle cx="96" cy="128" r="7.5" fill="#FFFFFF"/>
  </g>

  <g>
    <path d="M186 44 L242 62 L242 140 C242 182 210 210 186 222 C162 210 130 182 130 140 L130 62 Z"
