    <path d="M186 44 L242 62 L242 140 C242 182 210 210 186 222 Z" fill="#107A4B"/>
    <path d="M186 58 L230 72 L230 138 C230 170 206 190 186 199 C166 190 142 170 142 138 L142 72 Z"
