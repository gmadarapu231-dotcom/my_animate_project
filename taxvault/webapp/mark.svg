    <g fill="#FFFFFF" clip-path="url(#tvm-shield)">
      <circle cx="164" cy="112" r="4"/><circle cx="208" cy="136" r="4"/>
      <circle cx="162" cy="162" r="4"/><circle cx="210" cy="180" r="4"/>
      <circle cx="150" cy="148" r="4"/><circle cx="222" cy="108" r="4"/>
      <circle cx="164" cy="128" r="3.2"/><circle cx="208" cy="90" r="3.2"/>
