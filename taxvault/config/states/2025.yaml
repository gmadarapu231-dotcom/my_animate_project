# State personal income tax parameters, tax year 2025.
#
# Three kinds of jurisdiction, which is exactly the distinction the client
# screen shows:
#   type: none       -- no tax on wage income at all (9 states)
#   type: flat       -- one rate on all taxable income
#   type: graduated  -- a rate schedule
#
# `joint` says how the brackets behave for a joint return:
#   doubled   -- the single bands are doubled (most states)
#   same      -- the same bands apply (a marriage penalty; MD, VA, NY-ish)
#   table     -- an explicit `brackets.married_jointly` is given below
#
# Local taxes (city/county/school district) are NOT modelled per-locality;
# where they are significant the state carries `local_note` and an average
# `local_rate_typical` used only to widen the estimate range.
tax_year: 2025
as_of: "2025-01-01"
source: "State revenue department rate schedules and Tax Foundation 2025 summary"
review_required: true
disclaimer: >-
  State figures change mid-year by legislation and are modelled at statewide
  level. Treat a state number as an estimate to be confirmed against the
  state's own return before filing.

# ---------------------------------------------------------------------------
# No individual income tax on wages
# ---------------------------------------------------------------------------
states:
  AK: {name: Alaska, type: none, note: "No individual income tax and no state sales tax. Permanent Fund Dividend is federally taxable."}
  FL: {name: Florida, type: none, note: "No individual income tax; constitutionally prohibited."}
  NV: {name: Nevada, type: none, note: "No individual income tax."}
  NH:
    name: New Hampshire
    type: none
    note: "No wage income tax. The 3% interest & dividends tax was repealed effective 2025, so 2025 is the first year with no state income tax at all."
  SD: {name: South Dakota, type: none, note: "No individual income tax."}
  TN: {name: Tennessee, type: none, note: "No individual income tax; the Hall tax on interest and dividends ended in 2021."}
  TX: {name: Texas, type: none, note: "No individual income tax; constitutionally prohibited."}
  WA:
    name: Washington
    revenue_department: Washington Department of Revenue
    payment_url: https://dor.wa.gov/taxes-rates/other-taxes/capital-gains-tax
    type: none
    capital_gains_excise: {rate: 0.07, standard_deduction: 276000, rate_over_1m: 0.0985}
    note: "No tax on wages. A 7% excise tax applies to long-term capital gains above the annual standard deduction (9.9% on the portion over $1M)."
  WY: {name: Wyoming, type: none, note: "No individual income tax."}

