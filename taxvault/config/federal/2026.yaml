  roth_catch_up_wage_threshold: 150000
  ira: 7500
  ira_catch_up: 1100
  ira_deduction_phase_out:
    covered_single: [81000, 91000]
    covered_joint: [129000, 149000]
    spouse_covered_joint: [242000, 252000]
  roth_ira_phase_out:
