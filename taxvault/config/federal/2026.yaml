  salt_cap_married_separately: 20200
  salt_phase_down_threshold: 505000
  salt_phase_down_rate: 0.30
  salt_floor: 10000
  medical_agi_floor: 0.075
  student_loan_interest_cap: 2500
  student_loan_phase_out: {single: [85000, 100000], married_jointly: [175000, 205000]}
  educator_expense_cap: 300
  charitable_cash_agi_limit: 0.60
  # New for 2026 (OBBBA, permanent).
  charitable_itemised_agi_floor: 0.005
  charitable_nonitemiser_deduction: {single: 1000, married_jointly: 2000}
  tips_deduction_cap: 25000
  tips_phase_out: {single: 150000, married_jointly: 300000}
  overtime_deduction_cap: {single: 12500, married_jointly: 25000}
  overtime_phase_out: {single: 150000, married_jointly: 300000}
  car_loan_interest_cap: 10000
  car_loan_phase_out: {single: 100000, married_jointly: 200000}

# What 2026 changes about a home loan. Everything structural -- the debt
# ceilings, the grandfather date, the points rules -- is in shared.yaml.
#
# This is the year mortgage insurance premiums become deductible again, as
# qualified residence interest, permanently. They were not deductible for
# 2022-2025, so the same client with the same loan gets a different answer
# for 2025 and 2026, and that difference is worth showing them.
home_loans:
  mortgage_insurance_deductible: true

qbi:
  rate: 0.20
  threshold: {single: 201775, married_jointly: 403550}
  phase_in_range: {single: 75000, married_jointly: 150000}   # OBBBA widened this for 2026
  minimum_deduction: 400
  minimum_deduction_qbi_floor: 1000

amt:
  exemption: {single: 90100, married_jointly: 140200, married_separately: 70100,
              head_of_household: 90100, qualifying_surviving_spouse: 140200}
  phase_out_start: {single: 500000, married_jointly: 1000000, married_separately: 500000,
                    head_of_household: 500000, qualifying_surviving_spouse: 1000000}
  phase_out_rate: 0.50            # OBBBA doubled this from 25% for 2026
  rates: [{up_to: 244500, rate: 0.26}, {rate: 0.28}]

contribution_limits:
  elective_deferral_401k: 24500
  catch_up_401k: 8000
  super_catch_up_401k: 11250       # ages 60-63, SECURE 2.0
  super_catch_up_ages: [60, 61, 62, 63]
  annual_additions_401k: 72000     # IRC 415(c): employee + employer together
  compensation_limit: 360000       # IRC 401(a)(17)
  highly_compensated: 160000
