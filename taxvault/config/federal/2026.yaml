    married_jointly: [242000, 252000]
  hsa_self_only: 4400
  hsa_family: 8750
  hsa_catch_up: 1000
  health_fsa: 3400
  dependent_care_fsa: 5000
  dependent_care_fsa_separate: 2500
  simple_deferral: 17000
  simple_catch_up: 4000

