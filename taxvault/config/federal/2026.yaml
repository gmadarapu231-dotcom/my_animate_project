# Federal tax parameters, tax year 2026 (returns filed in 2027).
#
# Sourced from IRS Rev. Proc. 2025-32 (the annual inflation adjustments) and
# Notice 2025-67 (the retirement plan limits), on top of the permanent changes
# made by the One Big Beautiful Bill Act (P.L. 119-21).
#
# Three 2026-only changes matter enough to call out, because each one changes
# an answer this system gives:
#
#   1. Mortgage insurance premiums (PMI, FHA MIP, VA funding fees) become
#      deductible again as qualified residence interest, permanently, with a
#      phase-out that starts at $100,000 of AGI. They were NOT deductible for
#      2025, so the same client with the same loan gets a different answer in
#      consecutive years.
#   2. Itemised charitable contributions get a 0.5%-of-AGI floor, and
#      non-itemisers get a $1,000 / $2,000 above-the-line deduction.
#   3. The AMT exemption phase-out restarts at $500,000 / $1,000,000 and the
#      phase-out rate doubles to 50%.
#
# VERIFY BEFORE RELYING ON A FILING.
tax_year: 2026
as_of: "2025-11-13"
source: "IRS Rev. Proc. 2025-32; Notice 2025-67; P.L. 119-21 (OBBBA)"
due_date: "2027-04-15"
extended_due_date: "2027-10-15"

filing_statuses: [single, married_jointly, married_separately, head_of_household, qualifying_surviving_spouse]

