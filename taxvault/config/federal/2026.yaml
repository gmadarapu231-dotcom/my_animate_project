      - {children: 0, max_credit: 687,  earned_amount: 8950,  phase_out_single: 11200, phase_out_joint: 18700, credit_rate: 0.0765, phase_out_rate: 0.0765}
      - {children: 1, max_credit: 4582, earned_amount: 13480, phase_out_single: 24720, phase_out_joint: 32250, credit_rate: 0.34,   phase_out_rate: 0.1598}
      - {children: 2, max_credit: 7573, earned_amount: 18930, phase_out_single: 24720, phase_out_joint: 32250, credit_rate: 0.40,   phase_out_rate: 0.2106}
      - {children: 3, max_credit: 8519, earned_amount: 18930, phase_out_single: 24720, phase_out_joint: 32250, credit_rate: 0.45,   phase_out_rate: 0.2106}
    investment_income_limit: 12700
  american_opportunity:
    max_credit: 2500
    refundable_fraction: 0.40
    phase_out_start: {single: 80000, married_jointly: 160000}
    phase_out_end: {single: 90000, married_jointly: 180000}
  lifetime_learning:
    max_credit: 2000
    rate: 0.20
    expense_cap: 10000
    phase_out_start: {single: 80000, married_jointly: 160000}
    phase_out_end: {single: 90000, married_jointly: 180000}
  savers_credit:
    contribution_cap: 2000
    rates: [0.50, 0.20, 0.10]
    agi_bands:
      single: [24250, 26250, 40500]
      married_jointly: [48500, 52500, 81000]
      head_of_household: [36375, 39375, 60750]
  dependent_care:
