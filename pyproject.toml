[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "Universal AI career operating system, and TaxVault - US tax estimation and filing preparation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # TaxVault seals SSNs and bank details with AES-GCM; this is not optional.
    "cryptography>=41.0",
    # FastAPI needs it for the W-2 file upload endpoint.
    "python-multipart>=0.0.9",
    # Pulls the text out of a payroll-portal W-2 PDF so an upload produces
    # figures rather than homework.
    "pypdf>=4.0",
]

[project.optional-dependencies]
# The AI layer is optional by design: every engine has a deterministic path.
ai = ["anthropic>=1.0"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
careeros = "careeros.cli:main"
taxvault = "taxvault.cli:main"

[tool.setuptools.packages.find]
include = ["careeros*", "taxvault*"]

[tool.setuptools.package-data]
careeros = [
    "config/countries/*.yaml",
    "config/taxonomy/*.yaml",
    "config/sources/*.yaml",
    "dashboard/*.html",
]
taxvault = [
    "config/*.yaml",
    "config/federal/*.yaml",
    "config/states/*.yaml",
    "webapp/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:anyio.*"]
