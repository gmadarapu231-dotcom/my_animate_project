# ---------------------------------------------------------------------------
# Skill graph -- powers CROSS-DOMAIN / TRANSFERABLE skill matching.
#
# Each node is a canonical skill. `aliases` fold surface forms onto the node
# (DIRECT match). `related` are semantically adjacent skills: holding one is
# evidence of RELATED / TRANSFERABLE capability, never of direct experience.
# `broader` / `narrower` give hierarchy -- holding a narrower skill partially
# satisfies the broader requirement (PARTIAL match).
#
# Weights used by the matcher:
#   direct      1.00   alias or exact hit
#   narrower    0.80   candidate holds a more specific form of the requirement
#   broader     0.55   candidate holds the umbrella, not the specific tool
#   related     0.45   adjacent skill -- surfaced as TRANSFERABLE, flagged
# ---------------------------------------------------------------------------
version: 1

weights:
  direct: 1.0
  narrower: 0.8
  broader: 0.55
  related: 0.45

