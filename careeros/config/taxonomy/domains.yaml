    functions: [product_management, technical_program, project_management, scrum]
    title_patterns: ["product manager", "program manager", "project manager", "technical program manager", "scrum master", "product owner", "delivery manager"]
    keywords: {roadmap: 3, "stakeholder": 2, agile: 3, scrum: 3, jira: 2, "backlog": 3, kanban: 2, "product strategy": 3, "user stories": 3, "go-to-market": 3, pmp: 3, "risk register": 2, "okr": 2}

  - id: finance
    label: Finance & Accounting
