# ---------------------------------------------------------------------------
# SEED career-domain taxonomy.
#
# This file is a *prior*, not a closed list. The classifier scores a job
# against these signals; when nothing scores above the confidence floor the job
# is classified as `other` with an AI-inferred domain label, and that label is
# persisted as a new CareerDomain row. No code change is ever required to
# support a new job category.
# ---------------------------------------------------------------------------
version: 1
confidence_floor: 0.18          # below this the job falls through to `other`

domains:
  - id: networking
    label: Networking
    functions: [routing_switching, network_security, data_center, wireless, sd_wan, noc, network_architecture, cloud_networking]
    title_patterns: ["network engineer", "network architect", "noc engineer", "wireless engineer", "sd-wan", "network security engineer", "network administrator", "network analyst"]
    keywords: {bgp: 3, ospf: 3, eigrp: 3, mpls: 3, vxlan: 3, "sd-wan": 3, cisco: 2, juniper: 2, arista: 2, "cisco ise": 3, nexus: 2, "catalyst": 2, "packet capture": 2, "wireshark": 2, "f5": 2, "load balancer": 2, "routing": 2, "switching": 2, "vlan": 2, "firewall": 1, "ccna": 3, "ccnp": 3, "ccie": 3, "network topology": 2, "wan": 2, "lan": 2, "dmvpn": 3, "ipsec": 2, "qos": 2}

  - id: cybersecurity
    label: Cybersecurity
    functions: [soc, incident_response, iam, pam, appsec, cloud_security, grc, threat_hunting, pentest, vulnerability_management, devsecops, zero_trust]
    title_patterns: ["security engineer", "security analyst", "soc analyst", "cybersecurity", "penetration tester", "threat hunter", "incident response", "iam engineer", "pam engineer", "security architect", "grc analyst", "devsecops", "application security", "vulnerability"]
    keywords: {siem: 3, splunk: 3, "sentinel": 2, qradar: 3, soar: 3, "incident response": 3, "threat hunting": 3, "mitre att&ck": 3, edr: 3, crowdstrike: 3, "nist": 2, "iso 27001": 3, "soc 2": 3, "pci dss": 3, iam: 3, "identity and access management": 3, pam: 3, cyberark: 3, okta: 3, sailpoint: 3, "zero trust": 3, "penetration testing": 3, "burp suite": 3, nessus: 3, "vulnerability management": 3, cissp: 3, "comptia security+": 3, oscp: 3, "risk assessment": 2, "security controls": 2, "hipaa": 1}

  - id: sap
    label: SAP / ERP
    functions: [sap_security, sap_grc, sap_basis, s4hana, sap_iam, sap_authorization, sap_audit, sap_cloud_security]
    title_patterns: ["sap security", "sap grc", "sap basis", "sap consultant", "s/4hana", "sap authorization", "sap auditor", "sap functional", "erp consultant"]
    keywords: {sap: 3, "sap grc": 3, "access control": 2, "s/4hana": 3, "sap basis": 3, fiori: 3, "pfcg": 3, "su01": 3, "segregation of duties": 3, sod: 3, "firefighter": 3, "emergency access management": 3, "business role": 2, "sap iag": 3, "sap etd": 3, abap: 2, "hana": 2, "solution manager": 2, "sap netweaver": 3, "user provisioning": 2, "role redesign": 2, "risk analysis": 2}

  - id: data_engineering
    label: Data Engineering
    functions: [etl, big_data, warehousing, streaming, analytics_engineering, data_architecture]
    title_patterns: ["data engineer", "etl developer", "analytics engineer", "big data", "data architect", "databricks", "snowflake developer"]
    keywords: {spark: 3, airflow: 3, dbt: 3, snowflake: 3, databricks: 3, kafka: 3, "data pipeline": 3, etl: 3, elt: 3, redshift: 3, bigquery: 3, "data warehouse": 3, "data lake": 3, hadoop: 2, "delta lake": 3, glue: 2, "azure data factory": 3, "data modeling": 2, sql: 2, python: 1, "parquet": 2}

  - id: data_analytics
    label: Data & Business Intelligence
    functions: [bi, reporting, business_analytics, visualization]
    title_patterns: ["data analyst", "bi developer", "bi analyst", "business intelligence", "power bi developer", "tableau developer", "reporting analyst"]
    keywords: {"power bi": 3, tableau: 3, looker: 3, qlik: 3, "dax": 3, "excel": 2, sql: 3, "dashboard": 2, "kpi": 2, "reporting": 2, "data visualization": 3, "google analytics": 2}

  - id: ai_ml
    label: AI / Machine Learning
    functions: [machine_learning, deep_learning, generative_ai, mlops, nlp, computer_vision, data_science]
    title_patterns: ["machine learning engineer", "data scientist", "ai engineer", "ml engineer", "mlops", "generative ai", "nlp engineer", "computer vision", "research scientist"]
    keywords: {pytorch: 3, tensorflow: 3, "scikit-learn": 3, "hugging face": 3, llm: 3, "large language model": 3, rag: 3, "fine-tuning": 3, mlflow: 3, "feature engineering": 3, "model training": 3, "a/b test": 2, "deep learning": 3, nlp: 3, "computer vision": 3, "sagemaker": 3, "vertex ai": 3, "vector database": 3, "statistics": 2, "pandas": 2, "numpy": 2, python: 1, "model deployment": 2, "prompt engineering": 2}

  - id: cloud
