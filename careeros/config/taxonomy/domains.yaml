    title_patterns: ["software engineer", "backend developer", "frontend developer", "full stack", "web developer", "qa engineer", "sdet", "mobile developer", "application developer", "automation engineer"]
    keywords: {java: 3, python: 2, javascript: 3, typescript: 3, react: 3, angular: 3, "node.js": 3, ".net": 3, "c#": 3, spring: 3, django: 3, "rest api": 3, graphql: 3, microservices: 3, "unit test": 2, selenium: 3, cypress: 3, "design patterns": 2, git: 1, "code review": 2}

  - id: product_program
