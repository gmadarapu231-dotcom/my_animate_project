    title_patterns: ["healthcare analyst", "clinical data", "health informatics", "healthcare it", "ehr analyst", "epic analyst", "healthcare project manager", "medical coder"]
    keywords: {ehr: 3, emr: 3, epic: 3, cerner: 3, hipaa: 3, hl7: 3, fhir: 3, "icd-10": 3, "cpt": 3, "clinical": 2, "patient data": 3, "revenue cycle": 3, "meditech": 3, "claims": 2, "population health": 3}

  - id: sales_marketing
    label: Sales & Marketing
    functions: [sales, business_development, marketing, customer_success, product_marketing]
    title_patterns: ["sales engineer", "account manager", "business development", "marketing analyst", "digital marketing", "product marketing", "customer success", "account executive", "seo"]
    keywords: {salesforce: 3, hubspot: 3, crm: 2, seo: 3, sem: 3, "google analytics": 3, "lead generation": 3, "pipeline": 2, "quota": 3, "campaign": 2, "content marketing": 3, "churn": 3, "upsell": 3, "b2b": 2}

  - id: hr
    label: Human Resources
    functions: [recruiting, hr_business_partner, talent_acquisition, hr_analytics, compensation]
    title_patterns: ["recruiter", "hr analyst", "hr business partner", "talent acquisition", "hrbp", "compensation analyst", "people operations"]
    keywords: {ats: 3, workday: 3, "successfactors": 3, "onboarding": 2, "sourcing": 3, "employee relations": 3, "performance management": 3, "hris": 3, "benefits administration": 3, "full-cycle recruiting": 3}

  - id: other
    label: Other / Uncategorised
    functions: [general]
    title_patterns: []
    keywords: {}

# --- Seniority signals (country-agnostic) -----------------------------------
seniority:
  levels:
    - {id: intern,    label: Intern,        rank: 0, patterns: ["intern", "internship", "trainee", "co-op"]}
    - {id: entry,     label: Entry Level,   rank: 1, patterns: ["entry level", "junior", "jr.", "associate", "graduate", "fresher", "0-2 years"]}
    - {id: mid,       label: Mid Level,     rank: 2, patterns: ["mid level", "mid-level", "ii", "2-5 years", "3-5 years"]}
    - {id: senior,    label: Senior,        rank: 3, patterns: ["senior", "sr.", "sr ", "iii", "5+ years", "6+ years", "7+ years"]}
    - {id: lead,      label: Lead / Staff,  rank: 4, patterns: ["lead", "staff", "principal engineer", "tech lead", "team lead"]}
    - {id: principal, label: Principal,     rank: 5, patterns: ["principal", "distinguished", "architect", "10+ years", "12+ years"]}
    - {id: manager,   label: Manager,       rank: 5, patterns: ["manager", "head of", "supervisor"]}
    - {id: director,  label: Director+,     rank: 6, patterns: ["director", "vp ", "vice president", "chief", "cto", "ciso"]}
  default: mid

# --- Work arrangement -------------------------------------------------------
work_arrangement:
  - {id: remote, label: Remote, patterns: ["remote", "work from home", "wfh", "fully distributed", "100% remote"]}
  - {id: hybrid, label: Hybrid, patterns: ["hybrid", "2 days in office", "3 days onsite", "flexible onsite"]}
  - {id: onsite, label: On-site, patterns: ["on-site", "onsite", "in office", "in-person", "relocation required"]}
