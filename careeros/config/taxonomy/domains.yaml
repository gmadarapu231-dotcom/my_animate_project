    title_patterns: ["financial analyst", "accountant", "auditor", "investment analyst", "finance manager", "controller", "fp&a", "risk analyst", "treasury"]
    keywords: {"financial modeling": 3, gaap: 3, ifrs: 3, "variance analysis": 3, "forecasting": 2, "budgeting": 2, cfa: 3, cpa: 3, "excel": 2, "sox": 3, "reconciliation": 3, "p&l": 3, "valuation": 3, "accounts payable": 3, "accounts receivable": 3, quickbooks: 2, "sap fico": 3, "audit": 2}

  - id: business
