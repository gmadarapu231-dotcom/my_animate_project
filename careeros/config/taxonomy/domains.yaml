    functions: [business_analysis, operations, supply_chain, strategy, compliance]
    title_patterns: ["business analyst", "operations manager", "supply chain", "strategy analyst", "process analyst", "compliance analyst", "operations analyst"]
    keywords: {"requirements gathering": 3, "process improvement": 3, "six sigma": 3, "lean": 2, "sop": 2, "supply chain": 3, "vendor management": 2, "stakeholder management": 2, "gap analysis": 3, "business requirements": 3, visio: 2, "process mapping": 3}

