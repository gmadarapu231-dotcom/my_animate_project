    title_patterns: ["cloud engineer", "cloud architect", "devops engineer", "site reliability", "platform engineer", "aws engineer", "azure engineer", "gcp engineer", "infrastructure engineer"]
    keywords: {aws: 3, azure: 3, gcp: 3, kubernetes: 3, docker: 3, terraform: 3, ansible: 2, helm: 3, "ci/cd": 3, jenkins: 2, "github actions": 2, "gitops": 3, argocd: 3, "cloudformation": 3, "ec2": 2, "s3": 2, "lambda": 2, "eks": 3, "aks": 3, prometheus: 2, grafana: 2, "sre": 3, "iac": 3, "infrastructure as code": 3, "observability": 2}

